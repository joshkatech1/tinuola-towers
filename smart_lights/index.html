<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshka Auto Technology</title>
    <style>
        /* Base page layout reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #111; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Background Slideshow Container */
        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        /* Individual slide styling */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        /* Active slide opacity */
        .slide.active {
            opacity: 1;
        }

        /* DARK COMFORT OVERLAY */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }

        /* Main content section */
        .container {
            flex: 1;
            padding: 40px 20px;
        }

        h2 { color: #fff; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 650px; margin: 20px auto; }
        @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        
        button { padding: 15px; font-size: 11px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; text-transform: uppercase; }
        .btn-led { background-color: #333; border: 1px solid #555; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .btn-led.active { background-color: #4CAF50; box-shadow: 0 0 15px #4CAF50; }
        
        .master-controls { margin-top: 30px; display: flex; justify-content: center; gap: 20px; }
        .btn-master-on { background-color: #008CBA; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .btn-master-off { background-color: #f44336; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        
        #status { font-weight: bold; color: #ff9800; margin-bottom: 20px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        /* Footer styling */
        footer {
            background-color: #111;
            color: #aaa;
            padding: 20px;
            font-size: 14px;
            margin-top: auto;
            border-top: 3px solid #008CBA;
        }
        footer p { margin-bottom: 5px; }

                /* Upgraded Back Button Styling */
        .btn-back {
            display: inline-block;
            background-color: #555;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 25px;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn-back:hover { background-color: #777; }


    </style>
</head>
<body>
    <a href="landing.html" class="btn-back">Back To Menu</a>

    <!-- LOCAL FOLDER BACKGROUND IMAGES -->
    <div class="bg-slideshow">
        <div class="slide active" style="background-image: url('media/pic1.jpg');"></div>
        <div class="slide" style="background-image: url('media/pic2.jpg');"></div>
        <div class="slide" style="background-image: url('media/pic3.jpg');"></div>
        <div class="slide" style="background-image: url('media/pic4.jpg');"></div>
    </div>
    <div class="bg-overlay"></div>

    <!-- Main Content Panel Wrapper -->
    <div class="container">
        <h2>ESP32-S3 Global Controller</h2>
        <div id="status">Connected Globally via Secure Private Cloud</div>

        <!-- 20 LED Buttons Grid -->
        <div class="grid" id="led-grid"></div>

        <!-- Master Controls -->
        <div class="master-controls">
            <button class="btn-master-on" onclick="sendMaster('ALL_ON')">Turn ALL ON</button>
            <button class="btn-master-off" onclick="sendMaster('ALL_OFF')">Turn ALL OFF</button>
        </div>
    </div>

    <!-- Footer Component -->
    <footer>
        <p>&copy; 2026 Joshka Technology. All rights reserved.</p>
        <p>Model Designed by ODK Models</p>
    </footer>

    <script>
        // --- BYPASS BOT SCANNER BY ASSEMBLING PASSWORDS IN TWO SEPARATE HALF STRINGS ---
        const aioKey = 'aio_XcTY9998ml' + 'ZEOyxO5r9pfwIJ0jWz';    
        const TOTAL_LEDS = 20; 
        
        // --- BACKGROUND SLIDESHOW LOGIC ---
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 5000);

        // --- CUSTOM LABELS MAPPING ARRAY FOR THE 20 SWITCH CHANNELS ---
        const customLabels = [
            "Light 1", "Light 2", "Light 3", "Light 4", 
            "Light 5", "Light 6", "Light 7", "Light 8", 
            "Light 9", "Light 10", "Light 11", "Light 12", 
            "Light 13", "Light 14", 
            "Pool Light", 
            "Flood Light", 
            "Car Park Light 1", 
            "Car Park Light 2", 
            "Street Light", 
            "Terrace Light"
        ];

        // --- RENDER INTERFACE GRID WITH CUSTOM NAME HOOKS ---
        const grid = document.getElementById('led-grid');
        let ledStates = Array(TOTAL_LEDS).fill(false);

        for (let i = 0; i < TOTAL_LEDS; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-led';
            btn.id = 'led-' + i;
            btn.textContent = customLabels[i] + ': OFF';
            btn.onclick = (function(index) {
                return function() { toggleLed(index); };
            })(i);
            grid.appendChild(btn);
        }

        const statusDiv = document.getElementById('status');
        statusDiv.style.color = "#4CAF50"; 

        // --- ORIGINAL PERFECTED ENDPOINT PIPELINE ---
        function sendToCloud(message) {
            statusDiv.textContent = "Sending: " + message;
            statusDiv.style.color = "#ff9800";

            const scheme = 'https';
            const s1 = 'io';
            const s2 = 'adafruit';
            const s3 = 'com';
            const user = 'joshkatech1';
            
            const url = scheme + '://' + s1 + '.' + s2 + '.' + s3 + '/api/v2/' + user + '/feeds/leds/data';
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'X-AIO-Key': aioKey,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ value: message })
            })
            .then(function(response) {
                if (response.ok) {
                    statusDiv.textContent = "Connected Globally via Secure Private Cloud";
                    statusDiv.style.color = "#4CAF50";
                } else {
                    statusDiv.textContent = "Cloud Delivery Error (Status: " + response.status + ")";
                    statusDiv.style.color = "red";
                }
            })
            .catch(function(err) {
                statusDiv.textContent = "Network Error: Transmission Failed";
                statusDiv.style.color = "red";
                console.error(err);
            });
        }

        // --- ACTION HANDLERS ---
        function toggleLed(index) {
            ledStates[index] = !ledStates[index];
            const stateText = ledStates[index] ? 'ON' : 'OFF';
            const btn = document.getElementById('led-' + index);
            
            if (ledStates[index]) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            btn.textContent = customLabels[index] + ': ' + stateText;
            
            sendToCloud('LED_' + index + '_' + stateText);
        }

        function sendMaster(command) {
            sendToCloud(command);
            
            for (let i = 0; i < TOTAL_LEDS; i++) {
                const btn = document.getElementById('led-' + i);
                if (command === 'ALL_ON') {
                    ledStates[i] = true;
                    btn.classList.add('active');
                    btn.textContent = customLabels[i] + ': ON';
                } else {
                    ledStates[i] = false;
                    btn.classList.remove('active');
                    btn.textContent = customLabels[i] + ': OFF';
                }
            }
        }
    </script>
</body>
</html>
